name: Release Play Store

# Publica ao criar uma tag: git tag v1.1.1 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Segredos de assinatura e anuncios
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          printf '%s\n' "$ENV_FILE" > .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Versao a partir da tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then TAG="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"; fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # offset garante versionCode maior que o ja publicado
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build do bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}

      - name: Enviar para a Play Store (trilha interna)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.asclabs.calculadorapolias
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
